# Reply Desk configuration. Copy to reply-desk.toml (`reply-desk init` does it) and edit.
# Every value has a default in src/reply_desk/config.py; delete anything you don't need to change.
# Credentials never go in this file. They come from environment variables (see .env.example).

[business]
name = "Your business"
signature = "Your name\nYour business"    # ends every draft ({signature})
booking_url = ""                          # optional; lines that use {booking_url} are left out when empty
facts = ""                                # optional; the only facts the model may use in answers

[sending]
mode = "dry-run"            # dry-run: Send runs every check and sends nothing. live: approved replies are sent.
readback_seconds = [3, 10, 20]   # after a send is accepted, read it back by ID at these times; then lock

[inbox]                     # Instantly
campaign_ids = []           # only replies to these campaigns; empty means all
lookback_hours = 24         # how far back the very first poll reads
poll_seconds = 60           # with `run --loop`; Instantly's list endpoint allows 20 requests a minute
blocklist_unsubscribes = false   # live mode only: also add unsubscribes to the Instantly block list

[telegram]
allowed_user_ids = []       # Telegram user IDs allowed to tap buttons; empty means anyone in TELEGRAM_CHAT_ID

[model]                     # optional drafts and sorting; needs `uv sync --extra llm` and ANTHROPIC_API_KEY
enabled = false
model = "claude-opus-5-5"
effort = "low"
fallbacks = true

[pages]                     # the one-page site built for each interested reply
enabled = true
base_url = "https://pages.example.com"   # where the site folder is served; a page lives at <base_url>/<slug>/
publisher = "local"         # local: write site/<slug>/index.html only. command: also run `command` below.
command = []                # e.g. ["rsync", "-a", "{site_dir}/", "deploy@host:/srv/pages/"]; no shell
command_timeout_seconds = 120
check_attempts = 5          # ticks to wait for the page to answer 200 with its marker before giving up
headline = "Prepared for {first_name} at {company}"
paragraphs = ["Thanks for replying. This page sums up how {business} could help {company}."]
points = []                 # short bullet points
cta_label = "Pick a time to talk"   # the button links to business.booking_url

[followups]
gaps_days = [2, 4, 7]       # days before follow-up 1, 2 and 3 when the person named no time; [] turns them off
send_hour = 9               # local hour a follow-up becomes due
timezone = "UTC"            # UTC or an IANA name such as "America/New_York"; empty is rejected
max_days_out = 90           # a time they named further out than this is ignored as a misread

# Canned answers for questions, used by the rules (no model). The first entry with a matching
# keyword fills {answer}; with no match the draft says [[ write your answer here ]] and can't be
# sent until someone taps Edit.
# [[answers]]
# keywords = ["price", "pricing", "cost", "how much"]
# text = "It's a flat monthly fee. I can give you an exact number after a short call."

# Draft templates. Placeholders: {first_name} {company} {business} {signature} {booking_url}
# {page_url} {answer} {when} {opener}. A line whose placeholder is empty is left out.
[drafts]
interested = """Hi {first_name},

Thanks for getting back to me.

I put together a one-page overview for {company}: {page_url}

If you'd like to talk it through, you can pick a time here: {booking_url}

{signature}"""
question = """Hi {first_name},

{answer}

{signature}"""
not_now_later = """Hi {first_name},

Thanks, understood. I'll check back {when}.

{signature}"""
not_now_close = """Hi {first_name},

Thanks for letting me know. I won't follow up. If anything changes, just reply here.

{signature}"""
followup = """Hi {first_name},

{opener}

The overview for {company} is here: {page_url}

{signature}"""
followup_middle = """Hi {first_name},

One more nudge on this. If it helps, you can pick a time here: {booking_url}

{signature}"""
followup_last = """Hi {first_name},

Last note from me. If the timing is ever right, just reply here.

{signature}"""

[paths]
state = "state"             # reply-desk.db: the ledger, cards and follow-ups (keep out of git, back it up)
site = "site"               # generated pages
