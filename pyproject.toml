[project]
name = "reply-desk"
version = "0.1.0"
description = "Cold-email reply desk: sorts replies, sends Telegram approval cards, builds a one-page site for interested leads, and never sends the same email twice."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daymion Alvarez" }]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0"]

[project.scripts]
reply-desk = "reply_desk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reply_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]
